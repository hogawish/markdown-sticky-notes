<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>付箋</title>
  <script type="module" src="./note.js"></script>
</head>
<body class="note" data-color="yellow">
  <div id="bar" data-tauri-drag-region>
    <span id="title" data-tauri-drag-region></span>
    <button id="fmtbtn" title="書式のツールバーを出す / 隠す">Aa</button>
    <button id="color" title="付箋の色を変える">🎨</button>
    <button id="pin" title="前面に固定 / 解除">📌</button>
    <button id="return-tab" title="リンクしたタブに戻る" hidden>↗</button>
    <button id="attach" title="アプリのウィンドウに付ける">🔗</button>
    <button id="close" title="閉じる(付箋は残る)">✕</button>
  </div>
  <div id="fmt" hidden>
    <button data-cmd="bold" title="太字 (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button data-cmd="color" title="文字の色(/red などでも入れられる)"><span class="acolor">A</span></button>
    <button data-cmd="heading" title="見出し(押すたびに # → ## → ### → なし。Ctrl+Alt+1〜3 でも指定できる)">H</button>
    <button data-cmd="bullet" title="箇条書き (Ctrl+Shift+8)">•≡</button>
    <button data-cmd="number" title="番号つきリスト (Ctrl+Shift+7)">1.</button>
    <button data-cmd="code" title="コード(1行だけ選ぶとインライン Ctrl+E、それ以外はコードブロック Ctrl+Alt+C)">&lt;/&gt;</button>
  </div>
  <div id="palette" hidden></div>
  <div id="tpalette" hidden></div>
  <div id="conflict" hidden>
    <span>他で変更されました。</span>
    <button id="keep-mine">自分の内容で上書き</button>
    <button id="take-theirs">相手の内容を取り込む</button>
  </div>
  <div id="editor"></div>
  <dialog id="attachment-dialog">
    <form method="dialog"><button style="float:right">閉じる</button></form>
    <h3>アプリについてくる付箋</h3>
    <p>ウィンドウ追従とタブへのリンクは別々に設定できます。タブを切り替えても付箋の表示は変わりません。</p>
    <select id="attachment-target" aria-label="貼付先のウィンドウ" style="width:100%"></select>
    <select id="attachment-scope" aria-label="リンクするタブ" style="width:100%;margin-top:8px"><option value="">タブを選択</option></select>
    <p id="attachment-tab-help"><small>タブをリンクするには、Chrome／VS Code拡張でこのウィンドウを接続してください。</small></p>
    <p><button id="attachment-refresh">一覧更新</button> <button id="attachment-save">ウィンドウに付ける</button></p>
    <p><button id="tab-link-save">選んだタブをリンク</button> <button id="tab-link-remove">タブのリンクを外す</button></p>
    <p id="tab-link-current"></p>
    <p id="attachment-current"></p>
    <button id="attachment-remove">外してデスクトップに戻す</button>
    <p><small>貼付後は付箋をドラッグして位置を調整できます。タブを閉じてもメモは残ります。</small></p>
  </dialog>
  <div id="foot">
    <button id="archive" title="ファイルを移動せずアーカイブする">アーカイブ</button>
    <button id="trash" title="この付箋を片付ける(.trashへ移動)">🗑 片付ける</button>
    <span id="status"></span>
  </div>
</body>
</html>
