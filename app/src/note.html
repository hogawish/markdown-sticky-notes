<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>付箋</title>
  <script type="module" src="./note.js"></script>
</head>
<body class="note" data-color="yellow">
  <div id="bar" data-note-drag>
    <span id="note-grip" data-note-drag title="ドラッグして付箋を移動">⋮</span>
    <button id="edit-title" type="button" title="タイトルを変更" aria-label="タイトルを変更">✎</button>
    <form id="title-form" data-note-drag>
      <span id="title" data-note-drag></span>
      <input id="title-input" type="text" aria-label="タイトル" placeholder="本文の先頭行を使う" hidden />
    </form>
    <button id="fmtbtn" title="書式のツールバーを出す / 隠す">Aa</button>
    <button id="color" title="付箋の色を変える">🎨</button>
    <button id="pin" title="前面に固定 / 解除">📌</button>
    <button id="attach" aria-controls="link-menu" aria-expanded="false" title="ウィンドウをリンク（長押しでタブリンク）">🔗</button>
    <button id="attachment-options" title="表示設定" popovertarget="display-menu">▾</button>
    <button id="close" title="閉じる(付箋は残る)">✕</button>
  </div>
  <div id="title-error" role="alert" hidden></div>
  <div id="fmt" hidden>
    <button data-cmd="bold" title="太字 (Ctrl+B)"><b>B</b></button>
    <button data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
    <button data-cmd="color" title="文字の色(/red などでも入れられる)"><span class="acolor">A</span></button>
    <button data-cmd="heading" title="見出し(押すたびに # → ## → ### → なし。Ctrl+Alt+1〜3 でも指定できる)">H</button>
    <button data-cmd="bullet" title="箇条書き (Ctrl+Shift+8)">•≡</button>
    <button data-cmd="number" title="番号つきリスト (Ctrl+Shift+7)">1.</button>
    <button data-cmd="code" title="コード(1行だけ選ぶとインライン Ctrl+E、それ以外はコードブロック Ctrl+Alt+C)">&lt;/&gt;</button>
  </div>
  <div id="palette" hidden>
    <div class="appearance-header"><button id="finish-appearance" type="button">完了</button></div>
    <div id="appearance-presets"></div>
    <div id="paper-swatches" aria-label="色">
      <label id="custom-paper-color" title="好きな色を選ぶ"><input id="quick-paper-color" type="color" aria-label="好きな色を選ぶ" value="#fff3a3"></label>
    </div>
    <div id="paper-borders" aria-label="枠">
      <button type="button" data-border="thin">細枠</button>
      <button type="button" data-border="none">枠なし</button>
      <button type="button" data-border="stripe">左帯</button>
      <button id="edit-frame-color" type="button" aria-expanded="false">枠色…</button>
    </div>
    <div id="frame-color-form" class="appearance-controls" hidden>
      <input id="quick-frame-color" type="color" aria-label="枠色" value="#555555">
      <button id="reset-frame-color" type="button" disabled>元に戻す</button>
      <button id="auto-frame-color" type="button" title="付箋の地の色から枠色を決める">地の色に合わせる</button>
    </div>
    <details id="custom-appearance">
      <summary>今の見た目を保存…</summary>
      <form id="appearance-form">
        <div class="appearance-controls">
          <input id="appearance-name" aria-label="プリセット名" placeholder="名前（例：Slack）" maxlength="40">
          <button type="submit">スタイルを保存</button>
        </div>
      </form>
    </details>
    <details id="manage-appearance" hidden>
      <summary>スタイルを編集</summary>
      <div id="appearance-style-list"></div>
    </details>
  </div>
  <div id="tpalette" hidden></div>
  <div id="conflict" hidden>
    <span>他で変更されました。</span>
    <button id="keep-mine">自分の内容で上書き</button>
    <button id="take-theirs">相手の内容を取り込む</button>
  </div>
  <div id="editor"></div>
  <div id="display-menu" popover="auto" aria-label="表示設定">
    <button id="open-list" title="付箋の一覧の窓を開く(タスクトレイのアイコンと同じ)">📋 付箋の一覧を開く</button>
    <button id="duplicate-note" type="button"><span aria-hidden="true">⧉</span> 付箋を複製</button>
    <button id="open-shortcuts" title="ショートカットとコマンドの一覧を、別の窓で開く">⌨ ショートカット一覧</button>
    <label><input id="show-tags" type="checkbox" checked /> タグを表示</label>
    <label><input id="show-attachment" type="checkbox" checked /> 貼付先を表示</label>
    <label><input id="show-tab" type="checkbox" checked /> タブリンクを表示</label>
    <label><input id="show-status" type="checkbox" checked /> 状態を表示</label>
    <label title="入れると、カーソルのない行でも、Markdownの記号(** # - など)を隠さずに出します"><input id="show-markup" type="checkbox" /> Markdownの記号を常に表示</label>
  </div>
  <div id="link-menu" popover="manual" aria-label="リンク">
    <button id="pick-tab">クリックでタブをリンク</button>
    <button id="tab-settings">タブリンク設定…</button>
  </div>
  <div id="arrange-menu" popover="auto" aria-label="付箋の整列">
    <button id="arrange-open" type="button">整列…</button>
    <div id="arrange-options" hidden>
      <div id="arrange-preview" aria-hidden="true"><i>1</i><i>2</i><i>3</i></div>
      <div class="arrange-row" id="arrange-layout" role="group" aria-label="重ね方">
        <button type="button" data-layout="stack" aria-pressed="true">ずらして重ねる</button>
        <button type="button" data-layout="spread" aria-pressed="false">間隔を空ける</button>
      </div>
      <div class="arrange-row" id="arrange-front" role="group" aria-label="手前にする付箋">
        <button type="button" data-front="last" aria-pressed="true">最後が手前</button>
        <button type="button" data-front="first" aria-pressed="false">最初が手前</button>
      </div>
      <div id="arrange-directions" aria-label="向き">
        <button data-direction="up-left" aria-label="左上">↖</button><button data-direction="up" aria-label="上">↑</button><button data-direction="up-right" aria-label="右上">↗</button>
        <button data-direction="left" aria-label="左">←</button><button data-direction="right" aria-label="右">→</button>
        <button data-direction="down-left" aria-label="左下">↙</button><button data-direction="down" aria-label="下">↓</button><button data-direction="down-right" aria-label="右下">↘</button>
      </div>
      <button id="arrange-apply" type="button">整列</button>
    </div>
  </div>
  <dialog id="attachment-dialog" aria-labelledby="tab-settings-title">
    <h3 id="tab-settings-title">タブリンク設定</h3>
    <select id="attachment-target" aria-label="タブがあるウィンドウ" style="width:100%"></select>
    <select id="attachment-scope" aria-label="リンクするタブ" style="width:100%;margin-top:8px"><option value="">タブを選択</option></select>
    <p id="attachment-tab-help"><small>タブをリンクするには、Chrome／VS Code拡張でこのウィンドウを接続してください。</small></p>
    <p><button id="attachment-refresh">一覧更新</button></p>
    <p><button id="tab-link-save">選んだタブをリンク</button> <button id="tab-link-remove">タブのリンクを外す</button></p>
    <p id="tab-link-current"></p>
  </dialog>
  <dialog id="discard-tags-dialog" aria-labelledby="discard-tags-title">
    <h3 id="discard-tags-title">未保存の変更があります</h3>
    <form method="dialog">
      <button value="keep" autofocus>編集に戻る</button>
      <button value="discard">変更を破棄</button>
    </form>
  </dialog>
  <dialog id="tags-dialog" aria-labelledby="tags-title">
    <h3 id="tags-title">タグ</h3>
    <form id="tag-add">
      <div class="tag-field">
        <ul id="tag-list" aria-label="選択したタグ"></ul>
        <input id="tag-input" aria-controls="tag-suggestions" autocomplete="off" aria-label="タグを検索または追加" placeholder="タグを検索または追加" />
      </div>
    </form>
    <section id="tag-suggestions" aria-labelledby="tag-suggestions-label" hidden>
      <div id="tag-suggestions-label">タグを選択または作成</div>
      <ul id="tag-suggestion-list"></ul>
    </section>
    <div id="tag-color-editor" class="chip-color-editor" hidden>
      <span id="tag-color-preview"></span>
      <input id="tag-color" type="color" aria-label="タグの色" title="タグの色" />
      <button id="reset-tag-color" type="button" hidden>既定色</button>
    </div>
    <p id="tag-error" role="alert" hidden></p>
    <p><button id="tags-save">保存</button> <button id="tags-cancel">キャンセル</button></p>
  </dialog>
  <dialog id="close-dialog" aria-labelledby="close-dialog-title">
    <h3 id="close-dialog-title">保存できませんでした</h3>
    <p>入力はこの付箋に残っています。必要なら閉じる前に本文をコピーしてください。</p>
    <form method="dialog"><button autofocus>編集に戻る</button></form>
    <button id="discard-close" type="button">保存せず閉じる</button>
  </dialog>
  <div id="note-links" hidden>
    <div id="attachment-label" hidden></div>
    <button id="return-tab" type="button" hidden></button>
  </div>
  <div id="foot">
    <button id="tags" title="付箋のタグを編集">タグ</button>
    <button id="archive" title="ファイルを移動せずアーカイブする">アーカイブ</button>
    <button id="reveal" title="この付箋のファイルの場所を、エクスプローラーで開く">📂 場所</button>
    <button id="trash" title="この付箋のファイルを .trash フォルダに移動" hidden>🗑 ゴミ箱へ</button>
    <span id="status"></span>
  </div>
</body>
</html>
