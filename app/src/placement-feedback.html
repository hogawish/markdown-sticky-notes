<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>移動基準</title>
<style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
body{padding:4px;font:600 13px/26px "Yu Gothic UI",system-ui,sans-serif}
#label{box-sizing:border-box;height:36px;padding:4px 12px;border:1px solid #536171;border-radius:9px;background:#202832;color:#fff;text-align:center;white-space:nowrap;box-shadow:0 2px 4px #0003}
#label::before{content:"▣";color:#9bd4ff;margin-right:7px}
#label[data-basis="app"]::before{content:"▤";color:#ffd38a}
</style></head>
<body><div id="label" role="status" aria-live="polite"></div><script type="module" src="./placement-feedback.js"></script></body>
</html>
