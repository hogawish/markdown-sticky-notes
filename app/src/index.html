<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>付箋の一覧</title>
  <script type="module" src="./main.js"></script>
</head>
<body class="list">
  <header>
    <select id="target" title="新規付箋を作るフォルダ"></select>
    <button id="new" class="primary">新規付箋</button>
    <span class="grow"></span>
    <button id="open-tag-manager" type="button">タグ管理</button>
    <button id="open-settings" type="button">設定</button>
    <button id="quit" title="付箋ツールを終了する">終了</button>
  </header>
  <section id="folders">
    <div id="folder-chips"></div>
    <button id="add-folder">フォルダを追加…</button>
  </section>
  <nav id="note-views" aria-label="付箋の表示">
    <button type="button" data-view="active" aria-pressed="true">付箋</button>
    <button type="button" data-view="archived" aria-pressed="false">アーカイブ</button>
  </nav>
  <section id="filters" aria-label="付箋の絞り込みと並び替え">
    <input id="search" type="search" placeholder="本文・タイトルを検索" aria-label="付箋を検索" />
    <select id="filter-folder" aria-label="フォルダで絞り込む"></select>
    <select id="filter-tag" aria-label="タグで絞り込む"></select>
    <select id="filter-status" aria-label="statusで絞り込む"></select>
    <label>並び順 <select id="sort" aria-label="並び替えの項目">
      <option value="updated">更新日時</option><option value="created">作成日時</option>
      <option value="title">タイトル</option><option value="folder">フォルダ</option>
    </select></label>
    <button id="direction" aria-label="並び順を反転"></button>
    <button id="reset-filters">リセット</button>
    <span id="count" role="status"></span>
  </section>
  <div id="error" hidden></div>
  <output id="export-result" role="status"></output>
  <section id="bulk-notes" aria-label="付箋の一括整理">
    <label><input id="select-visible" type="checkbox" /> 表示中を選択</label>
    <button id="bulk-add-tags" type="button" disabled>タグを追加</button>
    <button id="bulk-open" type="button" disabled>まとめて開く</button>
    <button id="bulk-close" type="button" disabled>まとめて閉じる</button>
    <button id="bulk-export" type="button" disabled>ZIPで書き出す…</button>
    <button id="bulk-archive" type="button" disabled>一括アーカイブ</button>
    <button id="bulk-restore" type="button" hidden disabled>まとめて戻す</button>
    <button id="bulk-trash" type="button" hidden disabled>まとめてゴミ箱へ</button>
    <button id="bulk-clear-links" type="button" hidden disabled>リンクをまとめて解除</button>
    <span id="selection-count" role="status"></span>
  </section>
  <ul id="notes"></ul>
  <div id="empty" hidden></div>
  <dialog id="bulk-trash-dialog" aria-labelledby="bulk-trash-title">
    <h3 id="bulk-trash-title">ゴミ箱へ移動</h3>
    <p id="bulk-trash-summary"></p>
    <form method="dialog">
      <button value="cancel" autofocus>キャンセル</button>
      <button value="trash">ゴミ箱へ</button>
    </form>
  </dialog>
  <dialog id="bulk-clear-links-dialog" aria-labelledby="bulk-clear-links-title">
    <h3 id="bulk-clear-links-title">リンクをまとめて解除</h3>
    <p id="bulk-clear-links-summary"></p>
    <form method="dialog">
      <button value="cancel" autofocus>キャンセル</button>
      <button value="clear">解除する</button>
    </form>
  </dialog>
  <dialog id="status-dialog" aria-labelledby="status-title">
    <h3 id="status-title">Status</h3>
    <form id="status-form">
      <div class="tag-field status-field">
        <span id="status-current" class="tag-chip status-chip"></span>
        <input id="status-input" aria-label="Statusを検索または追加" placeholder="検索または追加" autocomplete="off" />
      </div>
      <ul id="status-options" aria-label="Statusの候補"></ul>
      <p id="status-error" role="alert" hidden></p>
      <p><button id="save-status">保存</button> <button id="cancel-status" type="button">キャンセル</button></p>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title">設定</h2>
      <form method="dialog"><button type="submit" autofocus>閉じる</button></form>
    </div>
    <section class="image-cleanup" aria-labelledby="import-title">
      <h3 id="import-title">付箋の取り込み</h3>
      <label for="import-folder">取り込み先</label>
      <select id="import-folder"></select>
      <button id="import-zip" type="button">ZIPを選ぶ…</button>
      <p id="import-result" role="status" hidden></p>
    </section>
    <section class="image-cleanup" aria-labelledby="list-style-title">
      <h3 id="list-style-title">付箋のスタイル</h3>
      <div id="list-style-manager"></div>
    </section>
    <section id="folder-history" aria-labelledby="folder-history-title">
      <h3 id="folder-history-title">登録解除の履歴</h3>
      <p id="folder-history-empty">登録を解除したフォルダはありません。</p>
      <ul id="removed-folders"></ul>
      <p id="folder-history-error" role="alert" hidden></p>
    </section>
    <section class="image-cleanup" aria-labelledby="image-cleanup-title">
      <h3 id="image-cleanup-title">添付画像</h3>
      <button id="scan-unused-images" type="button">未使用の画像を確認</button>
      <p id="unused-images-status" role="status"></p>
      <button id="trash-unused-images" type="button" hidden>まとめてゴミ箱へ</button>
    </section>
  </dialog>
  <dialog id="tag-manager-dialog" aria-labelledby="tag-manager-title">
    <h3 id="tag-manager-title">タグ管理</h3>
    <form id="tag-manager-form">
      <label>タグ <select id="manage-tag"></select></label>
      <p id="manage-tag-count" role="status"></p>
      <label>置換先 <input id="replacement-tag" list="existing-tags" placeholder="タグ名" /></label>
      <datalist id="existing-tags"></datalist>
      <p>
        <button id="replace-tag" type="submit" value="replace">置換…</button>
        <button id="delete-tag" type="submit" value="delete">削除…</button>
        <button id="close-tag-manager" type="button">閉じる</button>
      </p>
    </form>
  </dialog>
  <dialog id="tag-change-dialog" aria-labelledby="tag-change-title">
    <h3 id="tag-change-title">タグの変更確認</h3>
    <p id="tag-change-summary"></p>
    <form method="dialog">
      <button value="cancel" autofocus>キャンセル</button>
      <button id="apply-tag-change" value="apply">実行</button>
    </form>
  </dialog>
  <dialog id="discard-tags-dialog" aria-labelledby="discard-tags-title">
    <h3 id="discard-tags-title">未保存の変更があります</h3>
    <form method="dialog">
      <button value="keep" autofocus>編集に戻る</button>
      <button value="discard">変更を破棄</button>
    </form>
  </dialog>
  <dialog id="tags-dialog" aria-labelledby="tags-title">
    <h3 id="tags-title">タグ</h3>
    <form id="tag-add">
      <div class="tag-field">
        <ul id="tag-list" aria-label="選択したタグ"></ul>
        <input id="tag-input" aria-controls="tag-suggestions" autocomplete="off" aria-label="タグを検索または追加" placeholder="タグを検索または追加" />
      </div>
    </form>
    <section id="tag-suggestions" aria-labelledby="tag-suggestions-label" hidden>
      <div id="tag-suggestions-label">タグを選択または作成</div>
      <ul id="tag-suggestion-list"></ul>
    </section>
    <p id="tag-error" role="alert" hidden></p>
    <p><button id="tags-save">保存</button> <button id="tags-cancel">キャンセル</button></p>
  </dialog>
</body>
</html>
