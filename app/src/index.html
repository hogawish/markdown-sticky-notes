<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles.css" />
  <title>付箋の一覧</title>
  <script type="module" src="./main.js"></script>
</head>
<body class="list">
  <header>
    <select id="target" title="新規付箋を作るフォルダ"></select>
    <button id="new" class="primary">新規付箋</button>
    <span class="grow"></span>
    <button id="open-settings" type="button">設定</button>
    <button id="quit" title="付箋ツールを終了する">終了</button>
  </header>
  <section id="folders">
    <div id="folder-chips"></div>
    <button id="add-folder">フォルダを追加…</button>
  </section>
  <nav id="note-views" aria-label="付箋の表示">
    <button type="button" data-view="active" aria-pressed="true">付箋</button>
    <button type="button" data-view="archived" aria-pressed="false">アーカイブ</button>
  </nav>
  <section id="filters" aria-label="付箋の絞り込みと並び替え">
    <input id="search" type="search" placeholder="本文・タイトルを検索" aria-label="付箋を検索" />
    <select id="filter-folder" aria-label="フォルダで絞り込む"></select>
    <select id="filter-tag" aria-label="タグで絞り込む"></select>
    <select id="filter-status" aria-label="statusで絞り込む"></select>
    <label>並び順 <select id="sort" aria-label="並び替えの項目">
      <option value="updated">更新日時</option><option value="created">作成日時</option>
      <option value="title">タイトル</option><option value="folder">フォルダ</option>
    </select></label>
    <button id="direction" aria-label="並び順を反転"></button>
    <button id="reset-filters">リセット</button>
    <span id="count" role="status"></span>
  </section>
  <div id="error" hidden></div>
  <section id="bulk-notes" aria-label="付箋の一括整理">
    <label><input id="select-visible" type="checkbox" /> 表示中を選択</label>
    <button id="bulk-archive" type="button" disabled>一括アーカイブ</button>
    <button id="bulk-restore" type="button" hidden disabled>まとめて戻す</button>
    <button id="bulk-trash" type="button" hidden disabled>まとめてゴミ箱へ</button>
    <span id="selection-count" role="status"></span>
  </section>
  <ul id="notes"></ul>
  <div id="empty" hidden></div>
  <dialog id="bulk-trash-dialog" aria-labelledby="bulk-trash-title">
    <h3 id="bulk-trash-title">ゴミ箱へ移動</h3>
    <p id="bulk-trash-summary"></p>
    <form method="dialog">
      <button value="cancel" autofocus>キャンセル</button>
      <button value="trash">ゴミ箱へ</button>
    </form>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="settings-header">
      <h2 id="settings-title">設定</h2>
      <form method="dialog"><button type="submit" autofocus>閉じる</button></form>
    </div>
    <section id="folder-history" aria-labelledby="folder-history-title">
      <h3 id="folder-history-title">登録解除の履歴</h3>
      <p id="folder-history-empty">登録を解除したフォルダはありません。</p>
      <ul id="removed-folders"></ul>
      <p id="folder-history-error" role="alert" hidden></p>
    </section>
  </dialog>
  <dialog id="tags-dialog" aria-labelledby="tags-title">
    <h3 id="tags-title">タグ</h3>
    <ul id="tag-list"></ul>
    <form id="tag-add">
      <input id="tag-input" aria-label="新しいタグ" placeholder="新しいタグ" />
      <button>追加</button>
    </form>
    <p id="tag-error" role="alert" hidden></p>
    <p><button id="tags-save">保存</button> <button id="tags-cancel">キャンセル</button></p>
  </dialog>
</body>
</html>
