<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>重なり順</title><script type="module" src="./layer-order.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafaf8;color:#292925;font:14px "Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 7px}h1{font-size:15px;margin:0}button{font:inherit;background:transparent;border:0;border-radius:5px;padding:5px 8px;cursor:pointer}button:hover{background:#e9e9e4}button:disabled{opacity:.4;cursor:default}
.direction{color:#787870;font-size:11px;margin:0 15px 8px}#rows{flex:1;overflow:auto;list-style:none;margin:0;padding:0 10px 10px}
li{display:flex;align-items:center;gap:8px;border:1px solid #deded8;background:white;border-radius:7px;margin:5px 0;padding:9px 8px;cursor:grab;min-height:45px;user-select:none}li.current{border-color:#b6a762;background:#fffdf1}li.dragging{opacity:.4}li.over{border-top:3px solid #817236}li:focus-visible{outline:2px solid #817236}
.grip{color:#aaa}.swatch{width:11px;height:15px;flex:none;border-radius:2px;border:1px solid #0002}.text{min-width:0;flex:1}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{font-size:11px;color:#888;margin-top:2px}.arrows{display:flex}.arrows button{font-size:12px;padding:3px}
footer{border-top:1px solid #e6e6df;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}#state{color:#827d69;font-size:11px}#error{color:#a22;font-size:12px;padding:0 12px;margin:0}#error:empty{display:none}
</style></head><body>
<header><h1>重なり順</h1><button id="done">完了</button></header>
<p class="direction">手前 ↑　·　↓ 奥</p><p id="error" role="alert"></p><ul id="rows" aria-label="手前から奥への重なり順"></ul>
<footer><button id="reset">既定に戻す</button><span id="state" role="status"></span></footer>
</body></html>
