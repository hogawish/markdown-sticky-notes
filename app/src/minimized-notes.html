<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>最小化した付箋</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #notes { box-sizing: border-box; display: flex; gap: 4px; padding: 4px; height: 100vh; overflow: auto hidden; scrollbar-width: none; }
    button { flex: 0 0 160px; min-width: 0; padding: 0 10px; border: 1px solid #0005; border-radius: 6px; background: var(--paper); color: #202020; font: 600 12px system-ui; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer; }
    button.dark { color: white; border-color: #fff7; }
    button:hover { filter: brightness(0.93); }
    button:focus-visible { outline: 2px solid #3573c2; outline-offset: -3px; }
  </style>
  <script type="module" src="./minimized-notes.js"></script>
</head>
<body><div id="notes" aria-label="最小化した付箋"></div></body>
</html>
