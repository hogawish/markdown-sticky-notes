<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chrome連携 · Markdown Sticky Notes</title><link rel="stylesheet" href="migration.css"><script type="module" src="migration.js"></script></head>
<body><main>
<header><img src="icons/128.png" width="54" height="54" alt=""><div><p class="brand">Markdown Sticky Notes</p><h1>Chrome連携</h1></div></header>
<p id="edition">導入方法を確認しています…</p>
<section id="manual" hidden>
<h2>ストア版へ切り替える</h2>
<p>ストア公開後に使えます。付箋の本文・画像は残ります。</p>
<p><a id="store-link" target="_blank" rel="noopener noreferrer">ストアの公開を確認 ↗</a></p>
<label class="ready"><input type="checkbox" id="published">ストアページで追加できることを確認した</label>
<button id="migrate" disabled>ストア版へ切り替える</button>
<p class="hint">Chromeでこの手動版の削除を確認すると、ストアが開きます。「Chromeに追加」で完了です。</p>
</section>
<p id="status" role="status"></p>
<p class="hint">切り替え後は、拡張ボタンで再接続してタブをリンクし直してください。</p>
</main></body></html>
